<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見積もりテキスト生成 v17</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f8fc;
            --bg2: #e0f0f6;
            --bg3: #c8e4f0;
            --ac: #3888a8;
            --ac2: #72bcd4;
            --tx: #0a1e28;
            --tx2: #2c5868;
            --placeholder: #e0edf4;
        }

        body {
            font-family: 'Roboto', 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--bg);
            color: var(--tx);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(56, 136, 168, 0.12);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 2rem;
            color: var(--ac);
        }

        /* 本数と分数を横並びにする設定 */
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 1.5rem;
        }
        .input-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        .input-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--tx2);
        }

        .date-input-container {
            position: relative;
            width: 100%;
        }

        #valE {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--bg3);
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--tx);
            box-sizing: border-box;
            background: #fff;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.2s;
        }
        #valE:focus { border-color: var(--ac2); }

        #valE::-webkit-calendar-picker-indicator {
            position: absolute;
            left: 12px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            padding: 0;
            margin: 0;
            z-index: 10;
        }

        .num-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--bg3);
            border-radius: 14px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            color: var(--tx);
            transition: border-color 0.2s;
        }
        .num-input:focus { border-color: var(--ac2); }
        .num-input::placeholder { color: var(--placeholder); }

        /* 曜日ボタン */
        .day-btn-grid {
            display: grid;
            grid-template-columns: 45px 1fr 1fr 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
            align-items: center;
        }
        .row-label { font-size: 0.7rem; color: var(--ac); font-weight: bold; text-align: center; }
        
        .day-btn {
            padding: 10px 0;
            border: 2px solid var(--bg3);
            background: #fff;
            border-radius: 12px;
            cursor: pointer;
            color: var(--tx2);
            font-weight: bold;
            transition: all 0.2s ease; /* アニメーション追加 */
        }
        
        /* 曜日ボタンのホバー時 */
        .day-btn:hover {
            background: var(--bg2);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .day-btn.active { 
            background: var(--ac); 
            color: white; 
            border-color: var(--ac); 
            transform: translateY(0);
        }

        /* 出力エリア */
        .output-container {
            position: relative;
            margin-top: 2.5rem;
        }
        .output-area {
            background: var(--bg);
            border-radius: 18px;
            padding: 1.5rem;
            padding-top: 1.15rem;
            border: 2px solid var(--bg3);
        }
        .output-header {
            margin-bottom: 0.85rem;
            padding-right: 44px;
        }
        .mode-tabs {
            display: inline-flex;
            gap: 0;
            padding: 3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            border: 1px solid var(--bg3);
        }
        .mode-tab {
            padding: 5px 11px;
            border: none;
            border-radius: 7px;
            background: transparent;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--tx2);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
        .mode-tab:hover:not(.active) {
            background: rgba(56, 136, 168, 0.08);
        }
        .mode-tab.active {
            background: rgba(56, 136, 168, 0.14);
            color: var(--ac);
        }
        .output-text { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7; margin: 0; }

        .copy-wrapper { position: absolute; top: 12px; right: 12px; }
        
        .copy-icon-btn {
            background: #fff;
            border: 1px solid var(--bg3);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        /* コピーボタンのホバー時 */
        .copy-icon-btn:hover {
            background: var(--ac);
            border-color: var(--ac);
            transform: scale(1.1);
        }
        .copy-icon-btn:hover svg { fill: #fff; }

        .copy-icon-btn svg { width: 20px; height: 20px; fill: var(--tx2); transition: fill 0.2s; }
        
        .tooltip {
            position: absolute;
            bottom: 125%;
            right: 0;
            background: var(--tx);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            white-space: nowrap;
        }
        .copy-wrapper:hover .tooltip { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 見積もりメーカー</h1>

    <div class="input-row">
        <div class="input-group">
            <label>本数 (本)</label>
            <input type="number" id="valA" class="num-input" placeholder="例: 10">
        </div>

        <div class="input-group">
            <label>分数 (分)</label>
            <input type="number" id="valB" class="num-input" placeholder="例: 30">
        </div>
    </div>

    <div class="input-group">
        <label>納期</label>
        <div class="date-input-container">
            <input type="date" id="valE">
        </div>
        
        <div class="day-btn-grid">
            <div class="row-label">次</div>
            <button class="day-btn" onclick="setDay(1, 1)">月</button>
            <button class="day-btn" onclick="setDay(2, 1)">火</button>
            <button class="day-btn" onclick="setDay(3, 1)">水</button>
            <button class="day-btn" onclick="setDay(4, 1)">木</button>
            <button class="day-btn" onclick="setDay(5, 1)">金</button>
        </div>
        <div class="day-btn-grid">
            <div class="row-label">次次</div>
            <button class="day-btn" onclick="setDay(1, 2)">月</button>
            <button class="day-btn" onclick="setDay(2, 2)">火</button>
            <button class="day-btn" onclick="setDay(3, 2)">水</button>
            <button class="day-btn" onclick="setDay(4, 2)">木</button>
            <button class="day-btn" onclick="setDay(5, 2)">金</button>
        </div>
    </div>

    <div class="output-container">
        <div class="copy-wrapper">
            <span class="tooltip" id="tooltip">コピーする</span>
            <button class="copy-icon-btn" onclick="copyToClipboard()">
                <svg viewBox="0 0 24 24">
                    <path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
                </svg>
            </button>
        </div>
        <div class="output-area">
            <div class="output-header">
                <div class="mode-tabs" role="tablist" aria-label="コピーテキスト">
                    <button type="button" class="mode-tab active" id="tabNormal" role="tab" aria-selected="true" onclick="setEstimateMode('normal')">通常盤</button>
                    <button type="button" class="mode-tab" id="tabSecond" role="tab" aria-selected="false" onclick="setEstimateMode('second')">2件目以降</button>
                </div>
            </div>
            <pre class="output-text" id="outputText"></pre>
        </div>
    </div>
</div>

<script>
    const valA = document.getElementById('valA');
    const valB = document.getElementById('valB');
    const valE = document.getElementById('valE');
    const outputText = document.getElementById('outputText');
    const weekNames = ["日", "月", "火", "水", "木", "金", "土"];

    let estimateMode = 'normal';

    function setEstimateMode(mode) {
        estimateMode = mode;
        document.getElementById('tabNormal').classList.toggle('active', mode === 'normal');
        document.getElementById('tabSecond').classList.toggle('active', mode === 'second');
        document.getElementById('tabNormal').setAttribute('aria-selected', mode === 'normal');
        document.getElementById('tabSecond').setAttribute('aria-selected', mode === 'second');
        updateTemplate();
    }

    function formatTime(totalMinutes) {
        if (!totalMinutes) return "0分";
        const flooredMins = Math.floor(totalMinutes / 10) * 10;
        const h = Math.floor(flooredMins / 60);
        const m = flooredMins % 60;
        if (h === 0) return `${m}分`;
        if (m === 0) return `${h}時間`;
        return `${h}時間${m}分`;
    }

    function setDateValue(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        valE.value = `${yyyy}-${mm}-${dd}`;
        updateTemplate();
    }

    function setDay(dayOfWeek, weeksAhead) {
        let date = new Date();
        let currentDay = date.getDay();
        let diff = dayOfWeek - currentDay;
        if (diff <= 0) diff += 7;
        if (weeksAhead === 2) diff += 7;
        date.setDate(date.getDate() + diff);
        
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        if (event) event.target.classList.add('active');
        setDateValue(date);
    }

    function updateTemplate() {
        const a = valA.value || "0";
        const b = parseFloat(valB.value) || 0;
        const varC = formatTime(b * 5.7);
        const varD = formatTime(b * 6.2);
        const timeRange = varC === varD ? varC : `${varC}〜${varD}`;

        let dateShort = "";
        if (valE.value) {
            const date = new Date(valE.value);
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const w = weekNames[date.getDay()];
            dateShort = `${m}/${d}(${w})`;
        }

        const template = estimateMode === 'second'
            ? `お疲れ様です！
こちらもありがとうございます^^

見積もり以下でお願いいたします🙇‍♀️

元動画尺：${a}本 合計約${b}分
見積時間：${timeRange}程度
見込納期：${dateShort} 16:00`
            : `お疲れ様です！
お声がけありがとうございます^^

見積もりこちらでお願いいたします🙇‍♀️

元動画尺：${a}本 合計約${b}分
見積時間：${timeRange}程度
見込納期：${dateShort} 16:00`;

        outputText.textContent = template;
    }

    async function copyToClipboard() {
        try {
            await navigator.clipboard.writeText(outputText.textContent);
            const tooltip = document.getElementById('tooltip');
            tooltip.textContent = "コピーしました！";
            setTimeout(() => tooltip.textContent = "コピーする", 2000);
        } catch (err) { alert('コピー失敗'); }
    }

    valE.addEventListener('click', () => {
        if(valE.showPicker) valE.showPicker();
    });

    valE.addEventListener('change', () => {
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        updateTemplate();
    });

    [valA, valB].forEach(el => el.addEventListener('input', updateTemplate));
    
    setDateValue(new Date());
</script>

</body>
</html>
